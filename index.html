<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>北航期末突击 21 天</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-soft: #dbeafe;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --red-dark: #b91c1c;
      --purple: #8b5cf6;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
      --radius-sm: 12px;
      --nav-height: 126px;
      --top-height: 132px;
      --transition: all 0.25s ease;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      background: linear-gradient(180deg, #f7f9fc 0%, #f1f5f9 100%);
      overflow-x: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(244, 246, 249, 0.96);
      backdrop-filter: blur(8px);
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .panel {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .top-card {
      padding: 14px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .game-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .restart-btn {
      border: none;
      background: #eef2ff;
      color: #4338ca;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .restart-btn:active {
      transform: scale(0.96);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .meta-chip {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .exam-week {
      background: #fee2e2;
      color: var(--red-dark);
      border-color: #fecaca;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .energy-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .status-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.35s ease, background 0.35s ease;
    }

    .energy-fill {
      background: linear-gradient(90deg, #60a5fa, #2563eb);
    }

    .money-box {
      min-width: 110px;
      text-align: right;
      background: linear-gradient(135deg, #fff7ed, #fffbeb);
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
    }

    .content {
      padding: 12px 14px calc(var(--nav-height) + 28px);
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin: 14px 2px 10px;
      color: #334155;
    }

    .course-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .course-card {
      padding: 14px;
      transition: var(--transition);
    }

    .course-card.examined {
      opacity: 0.92;
      border: 1px solid #d1fae5;
      background: linear-gradient(180deg, #ffffff, #f0fdf4);
    }

    .course-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .course-name {
      font-size: 18px;
      font-weight: 800;
    }

    .course-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .badge.exam-time {
      background: #ede9fe;
      color: #6d28d9;
    }

    .badge.done {
      background: #dcfce7;
      color: #166534;
    }

    .badge.pending {
      background: #e0f2fe;
      color: #0369a1;
    }

    .course-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      gap: 8px;
      flex-wrap: wrap;
    }

    .course-score-row {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }

    .course-progress-fill {
      background: linear-gradient(90deg, #34d399, #10b981);
    }

    .log-card {
      padding: 12px;
    }

        .log-box {
      background: #0f172a;
      color: #e2e8f0;
            min-height: 280px;
      max-height: 360px;
      overflow-y: auto;
      border-radius: 14px;
      padding: 12px 12px 20px;
      font-size: 13px;
      line-height: 1.6;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.08);
    }

    .log-item {
      margin-bottom: 8px;
      word-break: break-word;
    }

    .log-item:last-child {
      margin-bottom: 0;
    }

    .log-time {
      color: #93c5fd;
      font-weight: 800;
      margin-right: 6px;
    }

    .log-normal {
      color: #e2e8f0;
    }

    .log-good {
      color: #86efac;
      font-weight: 700;
    }

    .log-warn {
      color: #fde68a;
      font-weight: 700;
    }

    .log-bad {
      color: #fca5a5;
      font-weight: 700;
    }

    .log-event {
      color: #c4b5fd;
      font-weight: 700;
    }

    .log-ai {
      color: #67e8f9;
      font-weight: 700;
    }

        .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 16px 12px 18px;
      background: rgba(244, 246, 249, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      z-index: 25;
    }

    .nav-card {
      padding: 10px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .nav-btn {
      border: none;
      border-radius: 14px;
      padding: 10px 6px;
      min-height: 60px;
      background: white;
      box-shadow: inset 0 0 0 1px #e5e7eb;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.3;
    }

    .nav-btn:hover {
      background: #f8fafc;
    }

    .nav-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .nav-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      background: #e5e7eb;
      color: #64748b;
      box-shadow: none;
    }

    .ai-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: #475569;
      font-weight: 800;
      padding: 4px 0 2px;
    }

    .ai-toggle input {
      width: 18px;
      height: 18px;
    }

    .modal-mask,
    .exam-mask,
    .settlement-mask {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-mask.show,
    .exam-mask.show,
    .settlement-mask.show {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    .modal-mask {
      background: rgba(15, 23, 42, 0.45);
    }

    .modal {
      width: 100%;
      max-width: 440px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.22);
      overflow: hidden;
      animation: popIn 0.24s ease;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
    }

    .close-btn {
      border: none;
      background: #f1f5f9;
      color: #475569;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      font-weight: 800;
    }

    .modal-body {
      padding: 14px 16px 16px;
      overflow-y: auto;
    }

    .modal-desc {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .select-card {
      border: 1px solid #e5e7eb;
      background: #f8fafc;
      border-radius: 16px;
      padding: 12px;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
    }

    .select-card:active {
      transform: scale(0.98);
    }

    .select-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #e5e7eb;
    }

    .select-name {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .select-sub {
      font-size: 12px;
      color: #64748b;
      font-weight: 700;
      line-height: 1.5;
    }

    .shop-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .shop-section {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 12px;
    }

    .shop-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #334155;
    }

    .item-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .item-card:last-child {
      margin-bottom: 0;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .item-name {
      font-size: 15px;
      font-weight: 800;
    }

    .item-price {
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .item-desc {
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .action-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
    }

    .buy-btn {
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      color: white;
    }

    .use-btn {
      background: linear-gradient(90deg, #10b981, #059669);
      color: white;
    }

    .secondary-btn {
      background: #e2e8f0;
      color: #334155;
    }

    .danger-btn {
      background: linear-gradient(90deg, #ef4444, #dc2626);
      color: white;
    }

    .question-card {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 14px;
    }

    .question-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #0f172a;
      line-height: 1.5;
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .option-btn:active {
      transform: scale(0.99);
    }

    .exam-mask {
      background: radial-gradient(circle at center, rgba(239,68,68,0.18), rgba(127,29,29,0.95));
      z-index: 80;
    }

    .exam-panel {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #fff1f2, #ffe4e6);
      border: 2px solid #fecaca;
      border-radius: 24px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(127, 29, 29, 0.35);
      animation: pulseUp 0.35s ease;
    }

    .exam-alert {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .exam-title {
      font-size: 24px;
      font-weight: 900;
      color: #991b1b;
      margin-bottom: 8px;
    }

    .exam-text {
      font-size: 14px;
      color: #7f1d1d;
      line-height: 1.7;
      margin-bottom: 18px;
      font-weight: 700;
    }

    .settlement-mask {
      background: rgba(15, 23, 42, 0.72);
      z-index: 90;
      align-items: flex-start;
      overflow-y: auto;
      padding: 20px 14px 120px;
    }

    .settlement-panel {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 30px 70px rgba(15, 23, 42, 0.32);
      overflow: hidden;
      animation: popIn 0.28s ease;
    }

    .settlement-header {
      background: linear-gradient(135deg, #1d4ed8, #7c3aed);
      color: white;
      padding: 20px 18px;
    }

    .settlement-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .settlement-sub {
      font-size: 13px;
      line-height: 1.7;
      opacity: 0.92;
    }

    .settlement-body {
      padding: 16px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-card {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .summary-num {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .summary-label {
      font-size: 12px;
      color: #64748b;
      font-weight: 700;
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .result-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 12px;
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .result-name {
      font-size: 16px;
      font-weight: 800;
    }

    .result-score {
      font-size: 15px;
      font-weight: 900;
      color: #1d4ed8;
    }

    .result-meta {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: #64748b;
      font-weight: 700;
    }

    .comment-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      border-radius: 16px;
      padding: 14px;
      line-height: 1.8;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .stats-list {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #334155;
      line-height: 1.8;
      font-weight: 700;
    }

    .footer-note {
      font-size: 12px;
      color: #64748b;
      line-height: 1.7;
      text-align: center;
      margin-top: 4px;
    }

    .welcome-list {
      margin: 0;
      padding-left: 18px;
      color: #475569;
      line-height: 1.8;
      font-size: 13px;
      font-weight: 700;
    }

    .empty-tip {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulseUp {
      0% {
        transform: scale(0.96);
        opacity: 0.9;
      }
      70% {
        transform: scale(1.02);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }

    @media (max-width: 380px) {
      .nav-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .select-grid {
        grid-template-columns: 1fr;
      }

      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="panel top-card">
        <div class="title-row">
          <div class="game-title">北航期末突击 21 天</div>
          <button class="restart-btn" id="restartBtn">重新开始</button>
        </div>
        <div class="meta-row">
          <div class="meta-chip" id="dayChip">第 1 天 / 21 天</div>
          <div class="meta-chip" id="periodChip">上午</div>
          <div class="meta-chip" id="phaseChip">备考期</div>
        </div>
        <div class="status-grid">
          <div class="energy-wrap">
            <div class="status-label">
              <span>精力值</span>
              <span id="energyText">100 / 100</span>
            </div>
            <div class="progress">
              <div class="progress-fill energy-fill" id="energyFill"></div>
            </div>
          </div>
          <div class="money-box" id="moneyText">🪙 80</div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="section-title">课程总览</div>
      <div class="course-list" id="courseList"></div>

      <div class="section-title">行动日志</div>
      <div class="panel log-card">
        <div class="log-box" id="logBox"></div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="panel nav-card">
        <div class="nav-grid">
          <button class="nav-btn" id="studyBtn">📚<br />选课复习</button>
          <button class="nav-btn" id="workBtn">💼<br />兼职赚钱</button>
          <button class="nav-btn" id="restBtn">🛏️<br />休息</button>
          <button class="nav-btn" id="shopBtn">🎒<br />超市/背包</button>
        </div>
        <label class="ai-toggle">
          <input type="checkbox" id="aiToggle" />
          <span>启用小航AI辅导</span>
        </label>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="modalMask">
    <div class="modal" id="modalBox">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">标题</div>
        <button class="close-btn" id="closeModalBtn">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="exam-mask" id="examMask">
    <div class="exam-panel">
      <div class="exam-alert">🚨</div>
      <div class="exam-title">考试强制开始</div>
      <div class="exam-text" id="examText">请立即参加考试。</div>
      <button class="action-btn danger-btn" id="takeExamBtn">参加考试</button>
    </div>
  </div>

  <div class="settlement-mask" id="settlementMask">
    <div class="settlement-panel">
      <div class="settlement-header">
        <div class="settlement-title">本局结算报告</div>
        <div class="settlement-sub">
          21 天突击结束，北航期末生存结果已出炉。下面是你的最终成绩与学院路风味评价。
        </div>
      </div>

    function clamp(num, min, max) {
      return Math.min(max, Math.max(min, num));
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function deepClone(obj) {
      return JSON.parse(JSON.stringify(obj));

    function periodToText(period) {
      return period === 0 ? "上午" : "下午";

          examPeriod: examSlots[index].period,
          examined: false,
          score: null,
          gpa: null,

    function advanceTime() {
      if (gameState.gameOver) return;

      if (gameState.period === 0) {
        gameState.period = 1;
      } else {
        gameState.period = 0;
        gameState.day += 1;
      }

      if (gameState.day > 21) {
        gameState.day = 21;
        gameState.period = 1;
        triggerSettlement();
        return;
      }

      refreshAllUI();

      // 每次时间推进后，检查是否需要强制考试
      checkForcedExam();

            // 只要 6 门课程全部完成考试，就立即结算
      if (isGameFinished()) {
        triggerSettlement();
      }
    }

        (course) =>
          !course.examined &&
          course.examDay === gameState.day &&
          course.examPeriod === gameState.period
      );
    }

      if (gameState.gameOver) return;

      const currentExamCourse = findCurrentExamCourse();

      if (currentExamCourse) {
        gameState.pendingExamCourseId = currentExamCourse.id;
        examText.innerHTML = `

    /**********************************************************************
     * 九、成绩与 GPA 计算
     **********************************************************************/

        function calculateExamScore(progress) {
          // 成绩公式调整后：
          // 1. 仍保留低复习时可能不及格的风险
          // 2. 中高复习投入可以明显转化为更高成绩
          // 3. 想稳定 90+ 仍需要较高 progress，但门槛比上一版略松
          let score = 34 + progress * 0.46 + randomInt(-7, 7);

          if (progress >= 110) score += 4;
          if (progress >= 140) score += 4;

          score = Math.round(clamp(score, 0, 100));
          return score;
        }

        function scoreToGpa(score) {
          // 参考北航绩点换算：
          // GPA = 4 - [3 * (100 - X)^2] / 1600
          // 为避免超过区间，对结果限制在 1.0 ~ 4.0 之间，保留高分奖励特征。
          const rawGpa = 4 - (3 * Math.pow(100 - score, 2)) / 1600;
          return Number(clamp(rawGpa, 1, 4).toFixed(2));
        }

    function takeExamForCourse(course) {
      const finalScore = calculateExamScore(course.progress);
      const finalGpa = scoreToGpa(finalScore);

      course.examined = true;
      course.score = finalScore;
      course.gpa = finalGpa;
      course.lockedProgress = course.progress;

      gameState.stats.totalExams += 1;

      let type = "normal";
      if (finalScore >= 90) type = "good";
      else if (finalScore < 60) type = "bad";
      else if (finalScore < 75) type = "warn";

      addLog(
        `${course.name} 考试结束，最终成绩 ${finalScore} 分，绩点 ${finalGpa.toFixed(1)}。`,
        type
      );
    }

        function getStudyGainByEnergy(energyBefore) {
      if (energyBefore > 80) return 12;
      if (energyBefore >= 60) return 10;
      if (energyBefore >= 50) return 8;
      if (energyBefore >= 30) return 6;
      return 4;
    }

        function maybeTriggerStudyEvent(course, payload, forceTrigger = false) {
      if (forceTrigger || Math.random() < 0.4) {
        const event = STUDY_EVENTS[randomInt(0, STUDY_EVENTS.length - 1)];
        const resultText = event.effect(gameState, course, payload);
        gameState.stats.randomEvents += 1;
        addLog(`【复习事件】${event.name}：${resultText}`, event.type);
        return {
          name: event.name,
          type: event.type,
          resultText,
        };
      }

    function confirmStudy(courseId) {
      const course = gameState.courses.find((c) => c.id === courseId);
      if (!course) return;

      openModal(
        "确认复习",
        `
        <div class="modal-desc">
          你将对 <b>${course.name}</b> 进行一次复习。<br />
          本次将消耗 <b>25 精力</b>。当前精力：<b>${gameState.energy}</b>。
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <button class="action-btn secondary-btn" id="cancelStudyBtn">返回</button>
          <button class="action-btn buy-btn" id="doStudyBtn">确认复习</button>
        </div>
        `
      );

      document.getElementById("cancelStudyBtn").addEventListener("click", openStudyModal);
      document.getElementById("doStudyBtn").addEventListener("click", () => {
        handleStudy(courseId);
      });
    }

    function handleStudy(courseId) {
      const course = gameState.courses.find((c) => c.id === courseId);
      if (!course || course.examined || gameState.gameOver) return;

      if (gameState.energy < 25) {
        addLog("精力不足 25，无法进行复习。", "warn");
        closeModal();
        refreshAllUI();
        return;
      }

      closeModal();

      maybeTriggerGlobalChoiceEvent("study", () => {
        const energyBefore = gameState.energy;
        let baseGain = getStudyGainByEnergy(energyBefore);

        if (gameState.flags.nextStudyBonus > 0) {
          addLog(`笔记/状态加成触发：本次复习额外 +${gameState.flags.nextStudyBonus}。`, "good");
          baseGain += gameState.flags.nextStudyBonus;
          gameState.flags.nextStudyBonus = 0;
        }

        const payload = {
          baseGain,
        };

        payload.eventInfo = maybeTriggerStudyEvent(course, payload);

        if (gameState.aiEnabled && Math.random() < 0.35) {
          gameState.stats.aiTriggered += 1;
          openAiQuiz(courseId, payload);
          return;
        }

        finalizeStudy(courseId, payload, false, false);
      });
    }

        function finalizeStudy(courseId, payload, aiTriggered, aiCorrect) {
      const course = gameState.courses.find((c) => c.id === courseId);
      if (!course) return;

      let gain = payload.baseGain;
      gain = Math.max(0, gain);

      if (aiTriggered && aiCorrect) {
        gain = Math.round(gain * 1.5);
        addLog(`小航AI辅导命中暴击！本次复习收益提升为 ${gain}。`, "ai");
      } else if (aiTriggered && !aiCorrect) {
        addLog("AI 辅导题答错了，本次仍按正常收益结算。", "warn");
      }

      gameState.energy = clamp(gameState.energy - 25, 0, 100);
      course.progress += gain;
      gameState.stats.totalStudy += 1;

      addLog(`你复习了 ${course.name}，获得 ${gain} 点复习进度。`, gain >= 15 ? "good" : "normal");

      const continueFlow = () => {
        refreshAllUI();
        advanceTime();
      };

      refreshAllUI();

      if (payload.eventInfo) {
        openEventResultModal(`复习事件：${payload.eventInfo.name}`, payload.eventInfo.resultText, "继续复习节奏", continueFlow);
        return;
      }

      continueFlow();
    }

        if (gameState.flags.restPenalty > 0) {
          addLog(`咖啡后遗症生效：本次休息恢复 -${gameState.flags.restPenalty}。`, "warn");

          gameState.flags.restPenalty = 0;

        const payload = { recovery };
        const restEventInfo = maybeTriggerRestEvent(payload);

        gameState.stats.totalRest += 1;

        addLog(`你选择了休息，恢复 ${recovery} 点精力。`, "good");

        continueFlow();

      if (gameState.money < item.price) {
        addLog(`金钱不足，无法购买 ${item.name}。`, "warn");
        openShopModal();
        refreshAllUI();
        return;
      }

      gameState.money -= item.price;
      gameState.inventory[itemKey] += 1;

      addLog(`你购买了 ${item.name} ×1。`, "good");
      openShopModal();
      refreshAllUI();
    }

    function confirmUseItem(itemKey) {
      const item = SHOP_ITEMS[itemKey];
      if (!item) return;

      openModal(
        "确认使用",
        `
        <div class="modal-desc">
          是否现在使用 <b>${item.name}</b>？<br />
          当前持有数量：<b>${gameState.inventory[itemKey]}</b>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <button class="action-btn secondary-btn" id="cancelUseBtn">返回</button>
          <button class="action-btn use-btn" id="doUseBtn">确认使用</button>
        </div>
        `
      );

      document.getElementById("cancelUseBtn").addEventListener("click", openShopModal);
      document.getElementById("doUseBtn").addEventListener("click", () => {
        handleUseItem(itemKey);
      });
    }

    function handleUseItem(itemKey) {
      const item = SHOP_ITEMS[itemKey];
      if (!item) return;

      if (gameState.inventory[itemKey] <= 0) {
        addLog(`${item.name} 数量不足，无法使用。`, "warn");
        openShopModal();
        refreshAllUI();
        return;
      }

      gameState.inventory[itemKey] -= 1;
      gameState.stats.totalItemsUsed += 1;

      if (itemKey === "redbull") {
        gameState.energy = clamp(gameState.energy + 30, 0, 100);
        addLog("你喝下红牛，恢复 30 精力。", "good");
      }

      if (itemKey === "notes") {
        gameState.flags.nextStudyBonus += 15;
        addLog("你使用了笔记，下次复习额外 +15。", "good");
      }

      if (itemKey === "shampoo") {
        gameState.energy = 100;
        gameState.flags.restPenalty = 0;
        addLog("你洗了个神清气爽的头，精力回满并清除休息惩罚。", "good");
      }

      openShopModal();
      refreshAllUI();
    }

    /**********************************************************************
     * 十八、游戏结束判断与结算系统
     **********************************************************************/

    function allCoursesExamined() {
      return gameState.courses.every((course) => course.examined);
    }

        function isGameFinished() {
      return allCoursesExamined();
    }

        function getEvaluationByGpa(avgGpa, avgScore, courses) {
      const failCount = courses.filter((course) => (course.score || 0) < 60).length;
      const highScoreCount = courses.filter((course) => (course.score || 0) >= 90).length;
      const excellentCount = courses.filter((course) => (course.score || 0) >= 85).length;
      const scoreSpread = Math.max(...courses.map((course) => course.score || 0)) - Math.min(...courses.map((course) => course.score || 0));
      const topCourse = [...courses].sort((a, b) => (b.score || 0) - (a.score || 0))[0];
      const lowCourse = [...courses].sort((a, b) => (a.score || 0) - (b.score || 0))[0];

      let title = "学院路普通生存者";
      if (failCount >= 3) {
        title = "大运村深度冬眠者";
      } else if (failCount >= 1) {
        title = "补考边缘试探专家";
      } else if (highScoreCount >= 5) {
        title = "沈元奖章预备役";
      } else if (highScoreCount >= 3) {
        title = "期末火力全开选手";
      } else if (excellentCount >= 4) {
        title = "稳定高绩点生产者";
      } else if (avgGpa >= 3.5) {
        title = "学院路卷王候选人";
      } else if (avgGpa >= 2.7) {
        title = "稳扎稳打通关者";
      } else if (avgGpa >= 2.0) {
        title = "及格线守门员";
      }

      let profile = "这学期你的总体表现还算均衡。";
      if (failCount >= 3) {
        profile = `你有 ${failCount} 门课程直接失守，说明这局不是时间不够，而是整体节奏已经彻底失控。`;
      } else if (failCount >= 1) {
        profile = `你虽然保住了大部分科目，但 ${lowCourse.name} 还是以 ${lowCourse.score} 分提醒你，战略放弃是有代价的。`;
      } else if (highScoreCount >= 5) {
        profile = `六门里有 ${highScoreCount} 门冲上 90+，这已经不是突击，这是对考试周的正面接管。`;
      } else if (highScoreCount >= 3) {
        profile = `你一共打出了 ${highScoreCount} 门 90+，高分爆发力很强，关键科目基本都抬上去了。`;
      } else if (excellentCount >= 4) {
        profile = `虽然 90+ 不算特别多，但你有 ${excellentCount} 门在 85 分以上，整体盘面非常扎实。`;
      } else if (scoreSpread >= 30) {
        profile = `你的成绩波动达到 ${scoreSpread} 分，说明这局明显偏科，${topCourse.name} 和 ${lowCourse.name} 几乎像是两个人在考。`;
      } else if (avgScore >= 80) {
        profile = "你没有极端高光，但整体都在线，属于老师看了会觉得很省心的一类成绩单。";
      } else {
        profile = "这份成绩单主打一个能活下来，但离真正从容还有一段距离。";
      }

      let styleComment = `本局最强科目是 ${topCourse.name}（${topCourse.score} 分），最危险科目是 ${lowCourse.name}（${lowCourse.score} 分）。`;
      if (scoreSpread >= 35) {
        styleComment += " 你的打法偏科很重，像是在用少数强课硬抬总盘。";
      } else if (highScoreCount >= 2 && failCount === 0) {
        styleComment += " 你的运营风格比较成熟，既能冲高分，也没有把弱课完全放掉。";
      } else if (gameState.stats.totalWork >= gameState.stats.totalStudy / 2) {
        styleComment += " 你在赚钱和学习之间分了不少精力，这份成绩已经算是多线程生存的结果。";
      } else if (gameState.stats.aiCorrect >= 3) {
        styleComment += " 你明显把 AI 辅导用出了价值，属于会借工具抬效率的实用主义选手。";
      } else {
        styleComment += " 下次如果能更早处理弱课，最终盘面还会更稳。";
      }

      return `<strong>${title}</strong><br />${profile}<br />${styleComment}`;
    }

    function triggerSettlement() {
      if (gameState.gameOver) return;

      // 若到结算时仍有未考试课程，说明玩家把时间拖到了最后；
      // 为保证系统完整性，这里对未触发的课程自动补考一次。
      gameState.courses.forEach((course) => {
        if (!course.examined) {
          addLog(`时间走到终局，系统为 ${course.name} 进行自动结算考试。`, "warn");
          takeExamForCourse(course);
        }
      });

      gameState.gameOver = true;
      examMask.classList.remove("show");
      closeModal();
      updateButtonStates();

      const scores = gameState.courses.map((c) => c.score || 0);
      const gpas = gameState.courses.map((c) => c.gpa || 0);
      const avgScore = scores.reduce((a, b) => a + b, 0) / scores.length;
      const avgGpa = gpas.reduce((a, b) => a + b, 0) / gpas.length;
      const evaluation = getEvaluationByGpa(avgGpa, avgScore, gameState.courses);

      settlementBody.innerHTML = `
        <div class="summary-grid">
          <div class="summary-card">
            <div class="summary-num">${avgScore.toFixed(1)}</div>
            <div class="summary-label">平均分</div>
          </div>
          <div class="summary-card">
            <div class="summary-num">${avgGpa.toFixed(2)}</div>
            <div class="summary-label">平均 GPA</div>
          </div>
          <div class="summary-card">
            <div class="summary-num">${gameState.money}</div>
            <div class="summary-label">结余金钱</div>
          </div>
          <div class="summary-card">
            <div class="summary-num">${gameState.energy}</div>
            <div class="summary-label">剩余精力</div>
          </div>
        </div>

        <div class="result-list">
          ${gameState.courses
            .map(
              (course) => `
                <div class="result-card">
                  <div class="result-top">
                    <div class="result-name">${course.name}</div>
                    <div class="result-score">${course.score} 分</div>
                  </div>
                  <div class="result-meta">
                    <span>绩点：${course.gpa.toFixed(1)}</span>
                    <span>复习点数：${Math.round(course.lockedProgress || course.progress)}</span>
                    <span>考试时间：${formatTimeSlot(course.examDay, course.examPeriod)}</span>
                  </div>
                </div>
              `
            )
            .join("")}
        </div>

        <div class="comment-box">
          ${evaluation}
        </div>

        <div class="stats-list">
          总复习次数：${gameState.stats.totalStudy}<br />
          总兼职次数：${gameState.stats.totalWork}<br />
          总休息次数：${gameState.stats.totalRest}<br />
          使用道具次数：${gameState.stats.totalItemsUsed}<br />
          AI 辅导触发次数：${gameState.stats.aiTriggered}<br />
          AI 辅导答对次数：${gameState.stats.aiCorrect}<br />
          突发事件触发次数：${gameState.stats.randomEvents}<br />
          已完成考试数：${gameState.stats.totalExams}
        </div>

        <div style="display:grid;grid-template-columns:1fr;gap:10px;">
          <button class="action-btn buy-btn" id="restartFromSettlementBtn">再来一局</button>
        </div>

        <div class="footer-note">
          北航期末突击 21 天结束。愿你下一次不再只靠最后一周硬抬 GPA。
        </div>
      `;

      settlementMask.classList.add("show");

      document
        .getElementById("restartFromSettlementBtn")
        .addEventListener("click", () => {
          settlementMask.classList.remove("show");
          initGame();
        });

      refreshAllUI();
    }

    /**********************************************************************
     * 十九、考试按钮逻辑
     **********************************************************************/

    takeExamBtn.addEventListener("click", () => {
      if (!gameState.pendingExamCourseId) return;

      const course = gameState.courses.find(
        (c) => c.id === gameState.pendingExamCourseId
      );
      if (!course) return;

      takeExamForCourse(course);

      examMask.classList.remove("show");
      gameState.pendingExamCourseId = null;

      refreshAllUI();

      if (isGameFinished()) {
        triggerSettlement();
      } else {
        advanceTime();
      }
    });

    /**********************************************************************
     * 二十、按钮事件绑定
     **********************************************************************/

    studyBtn.addEventListener("click", () => {
      openStudyModal();
    });

    workBtn.addEventListener("click", () => {
      openWorkModal();
    });

    restBtn.addEventListener("click", () => {
      handleRest();
    });

    shopBtn.addEventListener("click", () => {
      openShopModal();
    });

    aiToggle.addEventListener("change", () => {
      gameState.aiEnabled = aiToggle.checked;
      addLog(
        gameState.aiEnabled
          ? "你启用了小航AI辅导，复习时可能触发答题暴击。"
          : "你关闭了小航AI辅导，接下来将按普通复习结算。",
        "ai"
      );
      refreshAllUI();
    });

    restartBtn.addEventListener("click", () => {
      const ok = window.confirm("确定要重新开始本局游戏吗？当前进度将丢失。");
      if (ok) {
        settlementMask.classList.remove("show");
        initGame();
      }
    });

    /**********************************************************************
     * 二十一、初始化入口
     **********************************************************************/

    function initGame() {
      gameState = createInitialState();
      aiToggle.checked = false;

      // 初始日志
      addLog("新的学期末冲刺开始了。你看了看课表，深吸一口气。", "normal");
      addLog("6 门课程的考试时间已随机排定，请尽快规划复习路线。", "event");
      addLog("提示：考试周一旦到达考试档期，将被系统强制拉去考试。", "warn");

      settlementMask.classList.remove("show");
      closeModal();
      examMask.classList.remove("show");

      refreshAllUI();
      showWelcomeModal();
    }

    /**********************************************************************
     * 二十二、额外补充说明性辅助函数
     * --------------------------------------------------------------------
     * 下列辅助函数主要用于提升代码可读性与逻辑完整度，也方便后续
     * 修改与课堂展示时讲解系统结构。
     **********************************************************************/

    function getCourseById(courseId) {
      return gameState.courses.find((course) => course.id === courseId);
    }

    function getUpcomingExams() {
      return gameState.courses
        .filter((course) => !course.examined)
        .sort((a, b) => {
          if (a.examDay !== b.examDay) return a.examDay - b.examDay;
          return a.examPeriod - b.examPeriod;
        });
    }

    function summarizeCurrentSituation() {
      // 该函数当前主要用于扩展与调试，
      // 保留详细结构有利于课程作业答辩时展示“系统可维护性”。
      const remainingCourses = gameState.courses.filter((c) => !c.examined).length;
      const upcoming = getUpcomingExams()[0];
      return {
        currentTime: getCurrentTimeLabel(),
        phase: getCurrentPhase(gameState.day),
        energy: gameState.energy,
        money: gameState.money,
        remainingCourses,
        nextExam: upcoming
          ? `${upcoming.name} - ${formatTimeSlot(upcoming.examDay, upcoming.examPeriod)}`
          : "全部完成",
      };
    }

    function debugSnapshotToConsole() {
      // 调试输出函数，不影响正式玩法。
      // 如果在浏览器控制台中调用，可快速查看当前游戏全局状态。
      const snapshot = summarizeCurrentSituation();
      console.table(snapshot);
      console.table(
        gameState.courses.map((c) => ({
          科目: c.name,
          复习点数: c.progress,
          考试时间: formatTimeSlot(c.examDay, c.examPeriod),
          已考试: c.examined ? "是" : "否",
          成绩: c.score ?? "-",
          绩点: c.gpa ?? "-",
        }))
      );
    }

    window.debugSnapshotToConsole = debugSnapshotToConsole;

    /**********************************************************************
     * 二十三、为作业完整度增加的系统性注释说明
     * --------------------------------------------------------------------
     * 这一段注释用于清晰解释本项目设计思路：
     *
     * 1. 时间系统：
     *    - day 表示第几天，period 表示上午/下午
     *    - 每次有效行动结束后都通过 advanceTime() 统一推进
     *    - 这样保证所有系统共享同一个时间核心
     *
     * 2. 考试系统：
     *    - 开局从 14 个考试档位中随机抽 6 个
     *    - 每门课拥有唯一考试时间
     *    - 到点后通过 checkForcedExam() 强制锁定其他操作
     *    - 点击参加考试后才会继续推进时间
     *
     * 3. 复习收益：
     *    - 基础收益完全依赖“当前精力值”
     *    - 这让玩家必须权衡休息与学习，不可无脑连点复习
     *    - 再叠加随机事件和 AI 暴击，形成轻度 Roguelike 体验
     *
     * 4. 商店与背包：
     *    - 购买不推进时间，方便玩家进行战术规划
     *    - 背包道具可以立即使用，形成资源管理玩法
     *    - 笔记效果通过 flags.nextStudyBonus 实现一次性加成
     *
     * 5. GPA 结算：
     *    - 每门课考试后即时锁定成绩
     *    - 最终统一统计平均分与平均绩点
     *    - 配合北航风格评价文案，提高主题完成度
     *
     * 6. UI 结构：
     *    - 顶部状态栏固定，底部导航固定，中部滚动
     *    - 符合移动端竖屏 H5 的常见布局
     *    - 日志区使用深色背景，形成“播报终端”风格
     *
     * 7. 可维护性：
     *    - 事件池、题库、商品、兼职都使用数组/对象配置
     *    - 后续如果要继续扩写功能，只需增加配置项即可
     **********************************************************************/

    /**********************************************************************
     * 二十四、启动游戏
     **********************************************************************/

    initGame();
  </script>
</body>
</html>
